name: Bug report
description: Report a reproducible software or website defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What happened and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Include command, route, inputs, and traceback or console output.}
    validations: {required: true}
  - type: input
    id: commit
    attributes: {label: Commit SHA}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Environment, description: OS, Python/Node version, and browser if relevant.}
