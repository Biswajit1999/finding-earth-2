name: Deploy

# Builds the Next.js static export from the data already committed under
# web/public/data/ and publishes it to GitHub Pages. The scientific pipeline
# runs separately (see data-refresh.yml); this workflow never talks to the
# archives, so a Pages deploy can never fail because an archive is down.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          BASE_PATH: /finding-earth-2
        run: npm run build

      - name: Validate base-path routes and static assets
        env:
          BASE_PATH: /finding-earth-2
        run: npm run check:export

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
