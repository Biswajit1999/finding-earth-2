name: Data refresh

# Daily synchronisation with the live archives. Opens a pull request with
# whatever changed rather than committing straight to main, so a data update
# gets the same review as a code change -- and so a broken archive response
# cannot silently corrupt the published catalogue.
#
# Manual dispatch is also available for an on-demand refresh.

on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC every day; runs on GitHub while the author's computer is off
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev,products]"

      - name: Sync archives
        run: python -m earth2 sync

      - name: Run analysis
        run: python -m earth2 analyse

      - name: Generate figures
        run: python -m earth2 figures

      - name: Build deep dives
        run: python -m earth2 deepdive -n 10 --transit --rv

      - name: Validate transit pipeline
        run: python -m earth2 validate-transit

      - name: Export web data
        run: python -m earth2 export

      - name: Rebuild the v2 inference and observatory layers
        run: |
          python scripts/build_population_foundation.py
          python scripts/build_selection_surface.py
          python scripts/run_selection_validation.py
          python scripts/fit_reliability_model.py
          python scripts/run_hierarchical_validation.py
          python scripts/fit_occurrence_model.py
          python scripts/build_observed_intrinsic_story.py
          python scripts/build_composition_ensemble.py
          python scripts/prepare_mist_grid.py
          python scripts/build_continuous_hz.py
          python scripts/fetch_muscles_xuv.py
          python scripts/build_xuv_escape.py
          python scripts/build_atmosphere_evidence.py
          python scripts/build_atmospheric_earth_screen.py
          python scripts/fetch_hwo_catalogs.py
          python scripts/build_hwo_atlas.py
          python scripts/build_mission_observatory.py
          python scripts/build_information_gain.py
          python scripts/build_falsification_robustness.py
          python scripts/build_web_observatory.py

      # Candidate refreshes intentionally do not rewrite the hand-curated v2
      # README or the frozen publication bundle. Those artifacts are advanced
      # only in a reviewed release commit.
      - name: Run candidate-data test suite
        run: |
          pytest tests/ -v \
            -k "not test_all_scientific_release_gates_pass and not test_generated_macros_are_sourced_and_complete"

      - name: Open pull request if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "data: weekly archive synchronisation"
          title: "Weekly data refresh"
          body: |
            Automated daily re-synchronisation with the public astronomical archives and rebuild of the v2 evidence observatory.

            Generated by the `data-refresh` workflow. Review the diff in
            `results/analysis_summary.json` and `README.md` before merging --
            a changed count can mean either genuine new archive data or an
            archive-side change worth understanding before it goes live.
          branch: automated/data-refresh
          delete-branch: true
